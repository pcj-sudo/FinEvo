[project]
name = "rsi-finance-generation"
version = "0.1.0"
description = "Codex-driven financial spreadsheet task construction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "harbor @ git+https://github.com/laude-institute/harbor.git@e1be9bd39c368f88a27fee4cbd26655e9994ee5a",
  "openpyxl==3.1.5",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
]
[project.scripts]
rsi-generate = "rsi_generation.cli:main"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rsi_generation"]
[tool.hatch.metadata]
allow-direct-references = true
